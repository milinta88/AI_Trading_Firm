app:
  name: AI Trading Firm
  mode: research
  timezone: Asia/Bangkok

database:
  path: data/database.db

logging:
  level: INFO
  file_path: data/logs/ai_trading_firm.log

telegram:
  timeout_seconds: 10
  dry_run_if_missing_credentials: true

market_data:
  timeout_seconds: 10
  btc_public_price_url: https://api.binance.com/api/v3/ticker/price
  fear_and_greed_url: https://api.alternative.me/fng/

btc_derivatives:
  symbol: BTCUSDT
  funding_rate_url: https://fapi.binance.com/fapi/v1/premiumIndex
  open_interest_url: https://fapi.binance.com/fapi/v1/openInterest

fred:
  base_url: https://api.stlouisfed.org/fred/series/observations
  timeout_seconds: 10
  stale_after_days_by_series:
    gold_us10y: 10
    gold_real_yield: 10
    gold_fed_funds: 75
    gold_cpi: 75
  series:
    gold_us10y:
      series_id: DGS10
      data_type: us10y
      display_name: US10Y
    gold_real_yield:
      series_id: DFII10
      data_type: real_yield
      display_name: Real Yield
    gold_fed_funds:
      series_id: FEDFUNDS
      data_type: fed_funds
      display_name: Fed Funds
    gold_cpi:
      series_id: CPIAUCSL
      data_type: cpi
      display_name: CPI

gold_spot_provider:
  enabled: true
  provider: goldapi_io
  url: ""
  api_key_env: GOLD_API_KEY
  timeout_seconds: 10

dxy_provider:
  enabled: true
  provider: yahoo_finance
  symbol: DX-Y.NYB
  timeout_seconds: 10

risk:
  max_daily_loss_pct: 1.0
  max_weekly_loss_pct: 3.0
  # Must remain false. This project does not execute real trades.
  execution_enabled: false

paper_trading:
  enabled: false
  starting_equity: 1000
  base_currency: USD
  max_risk_per_trade_pct: 0.25
  max_daily_loss_pct: 1.0
  max_open_positions: 2
  allow_long: true
  allow_short: true
  fill_mode: close_price

paper_signal:
  profile: conservative
  btc_long_score_threshold: 70
  btc_short_score_threshold: 35
  gold_long_score_threshold: 70
  gold_short_score_threshold: 35
  min_confidence: Medium
  min_btc_data_completeness: 80
  min_gold_data_completeness: 60
  allow_neutral_bias: false
  exploratory_mode: false

research_readiness:
  enabled: true
  min_snapshots_for_regime: 10
  stale_after_minutes:
    btc_price: 60
    btc_derivatives: 240
    fear_and_greed: 1440
    gold_macro: 4320
  min_readiness_score_for_decision: 70
